# pyproject.toml - PEP 621 compliant configuration
# Supported OS: Windows 10/11, Ubuntu

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "IggHydrate"
version = "1.9.25"
description = "IggHydrate - Comprehensive hydrate simulation tool (import as 'zmlx', conflicts with other zmlx packages - uninstall them first)"
authors = [
    { name = "Zhaobin Zhang", email = "zhangzhaobin@mail.iggcas.ac.cn" }
]
readme = "README.md"
# 最低 Python 3.9（2026-11-06 起由 3.8 上调）：
#   - 3.8 已于 2024-10 EOL，不再有安全更新；
#   - 3.8 的 f-string **不允许表达式里出现反斜杠**（3.12 才放开），这类写法会让整个模块
#     在导入期 SyntaxError，而 GUI 又会把导入异常吞成「没有界面」，排错代价很高。
requires-python = ">=3.9"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Core dependencies (cross-platform)
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyqtgraph",
    "PyOpenGL",
    "pillow", # 处理图片
    "pyvista",
    "pyvistaqt",
    "vtk",
    "PyQt6",
    "PyQt6-WebEngine",
    "pyqt6-qscintilla",
]

[project.optional-dependencies]
# Platform-specific dependencies
windows = ["pywin32"]
# 加速计算（可选）
accelerate = ["numba"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
# ⚠️ _private 下是**内部说明**（授权体系的原理、协议细节），
#    刻意**不随发行包发布**，见 zmlx/_private/AUTHORIZATION_NOTES.md 的文件头。
exclude = ["tests*", "*tests*", "_private*", "*_private*"]

[tool.setuptools]
include-package-data = true
py-modules = ["zml", "zml_ui"]

[tool.setuptools.package-data]
# Include all files in zmlx directory
# ⚠️ 排除 _private：那里放的是不对外公开的内部说明（同上）。
"zmlx" = ["**/*", "!_private/**", "!_private"]